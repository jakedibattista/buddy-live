# Build and deploy the Buddy Live ADK service to Cloud Run.
#
# Submit with:
#   gcloud builds submit \
#     --config infra/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE=buddy-live-adk,_RUNTIME_SERVICE_ACCOUNT=...
#
# Required env / secrets on the Cloud Run service (set via gcloud after the first
# deploy):
#   GOOGLE_API_KEY               -- Gemini API key (or use Vertex via service account)
#   MODELFORPUCKBUDDY_API_URL    -- e.g. https://api.buddysports.app
#   MODELFORPUCKBUDDY_BEARER_TOKEN (optional) or MODELFORPUCKBUDDY_API_KEY
#   CORS_ALLOW_ORIGINS           -- comma-separated origins for the Vercel web app
#
# Optional env (Track 2 observability):
#   BUDDY_ENABLE_CLOUD_TRACE=1   -- export ADK + custom spans to Cloud Trace.
#                                   Runtime SA needs roles/cloudtrace.agent.
#   SENTRY_DSN                   -- forward errors + perf transactions to Sentry.
#
# Optional env (Track 2 grounding / RAG, Phase 3):
#   BUDDY_VERTEX_SEARCH_DATA_STORE_ID
#                                -- full Vertex AI Search data store resource path,
#                                   e.g. projects/puck-buddy/locations/global/
#                                   collections/default_collection/dataStores/buddy-live-drills
#                                   When set, `lookup_drill_knowledge` retrieves from
#                                   the curated drill corpus; when unset the tool
#                                   no-ops and `recommend_drill` falls back to its
#                                   legacy hand-curated dict. Runtime SA needs
#                                   roles/discoveryengine.viewer.
#   BUDDY_VERTEX_SEARCH_SERVING_CONFIG
#                                -- optional serving config id override
#                                   (defaults to default_search).

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$_TAG
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest
      - $_CONTEXT_DIR

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$_TAG
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --concurrency=20
      - --timeout=300
      - --min-instances=$_MIN_INSTANCES
      - --max-instances=$_MAX_INSTANCES
      - --service-account=$_RUNTIME_SERVICE_ACCOUNT

substitutions:
  _REGION: us-central1
  _SERVICE: buddy-live-adk
  _REPO: buddy-live
  _TAG: dev
  _CONTEXT_DIR: services/buddy-live-adk
  _MIN_INSTANCES: "1"
  _MAX_INSTANCES: "5"
  _RUNTIME_SERVICE_ACCOUNT: ""

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:$_TAG
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/$_SERVICE:latest

options:
  logging: CLOUD_LOGGING_ONLY
